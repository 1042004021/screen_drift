# Pixels per (m/s^2) forcing in the spring equation; larger = more movement.
gain=6000
# Spring natural frequency (Hz); larger = faster return.
frequency=2.4
# <1 allows rebound; 1 critically damped; >1 slower without rebound.
damping=0.8
# Maximum translation on each axis (pixels).
limit=110
# Extra sensitivity for vertical movement (Y axis).
verticalGain=1.5
fps=120
# Experimental sessions are always time-limited, maximum 600 seconds.
seconds=60
